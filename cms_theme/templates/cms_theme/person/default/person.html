{% load cms_theme_tags %}
{% capped_image instance 600 as capped %}
<div class="person text-center">
    <img src="{{ capped.url }}" alt="{{ instance.name }}" loading="lazy" decoding="async" class="rounded-circle" />
    <div class="name">{{ instance.name }}</div>
    {% if instance.role %}
        <div class="role text-muted">{{ instance.role }}</div>
    {% endif %}
</div>
