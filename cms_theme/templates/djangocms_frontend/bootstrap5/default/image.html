{% load thumbnail frontend cms_theme_tags %}
{% if picture_link %}
    <a href="{{ picture_link }}"
        {% if instance.target %} target="{{ instance.target }}"{% endif %}
        {% get_attributes instance.link_attributes %}>
{% endif %}
    {% capped_image instance as capped %}
    <div style="border-radius: 20px; overflow: hidden;" class="shaddow-sm">
        <img src="{{ capped.url }}" loading="lazy" decoding="async" {% if not instance.attributes.alt %}alt="{{ instance.rel_image.default_alt_text|default_if_none:'' }}"{% endif %} {% if instance.width %} width="{{ instance.width|safe }}"{% endif %} {% if instance.height %} height="{{ instance.height|safe }}"{% endif %}
            {% if img_srcset_data %}
                srcset="{% for size, thumb in img_srcset_data %}{{ thumb.url }} {{ size|safe }}w,{% endfor %}{{ capped.url }} {{ capped.width }}w"
                sizes="{% for size, thumb in img_srcset_data %}(max-width: {{ size|safe }}px) {{ size|safe }}px, {% endfor %} {{ picture_size.size.0|safe }}px"
            {% endif %}
            {{ instance.get_attributes }} />
    </div>
{% if picture_link %}
    </a>
{% endif %}
